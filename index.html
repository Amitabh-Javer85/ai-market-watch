<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Market Watch</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 13% 33%,#1a3966 0,transparent 45%),radial-gradient(ellipse at 99% 23%,#382d34 0,transparent 36%),#091420;color:#f0f5ff;font:14px/1.4 "Segoe UI",Arial,sans-serif;min-height:100vh;color-scheme:dark}main,header>div{max-width:1430px;margin:auto;padding:0 clamp(16px,4vw,64px)}header{border-bottom:1px solid #ffffff1c;background:#0c1929ab}header>div,.row,.ctrl,.identity,.titleline,.ranges{display:flex;align-items:center;gap:12px}header>div{height:64px;justify-content:space-between}.identity{font-weight:700;font-size:18px;letter-spacing:-.6px}.mark{width:31px;height:31px;background:repeating-linear-gradient(121deg,transparent 0 5px,#ffa462 5px 10px);border-radius:7px;transform:skewX(-5deg)}.mono,.tag,.symbol,th,.stamp{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}.tag,th{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#b7c8de}.stamp{color:#b9cadd;font-size:12px}.stamp b{color:#ffb274}.titleline,.row{justify-content:space-between}.titleline{margin:27px 0 19px}.titleline h1{font-size:clamp(29px,3vw,42px);letter-spacing:-1.7px;margin:0;line-height:1.12}.meta{color:#bdcbdf;margin:5px 0 0}.glass{background:linear-gradient(132deg,#273e5bd6,#16283eea 57%,#1a2838ed);border:1px solid #9cbbdb40;border-top-color:#bad6f563;border-radius:18px;box-shadow:inset 0 1px 0 #ffffff09,0 8px 28px #02080f21;backdrop-filter:blur(18px)}button,select,input,summary{font:inherit}button,select,input{border:1px solid #91abc447;border-radius:9px;background:#15273a;color:inherit;padding:9px 12px;min-height:42px}button,select,summary{cursor:pointer}button:hover,select:hover{border-color:#aeccee}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #a8d0ff;outline-offset:3px}.refresh{background:linear-gradient(#ffb978,#ff9952);color:#211b17;font-weight:650;border-color:#ffc599;box-shadow:inset 0 1px 0 #ffe1bd;min-width:110px}.metrics{display:grid;grid-template-columns:1.15fr 1fr 1fr;padding:19px 0;margin-bottom:16px}.metric{padding:0 25px}.metric+.metric{border-left:1px solid #c3d4f62b}.big{font-weight:600;font-size:30px;line-height:1.25;letter-spacing:-1.1px;font-variant-numeric:tabular-nums}.small{font-size:12px;color:#bdcadd}.up{color:#83ebbb}.down{color:#ff9ba6}.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(265px,1fr);gap:16px}.panel{padding:22px 24px}.panel h2{font-size:20px;margin:2px 0;letter-spacing:-.5px}.price{font-size:38px;font-weight:630;letter-spacing:-1.7px;font-variant-numeric:tabular-nums}.change{font-weight:600;margin-left:9px}.ranges{gap:2px}.ranges button{border:0;background:transparent;border-radius:6px;font-size:12px;min-height:36px;padding:6px 9px;color:#bdcadd}.ranges button[aria-pressed=true]{background:#405c80;color:white}.plot{width:100%;height:179px;display:block;overflow:visible}.plot text{fill:#b5c6dc;font:11px Consolas,monospace}details summary{color:#b9cce5;font-size:12px;min-height:24px}.history{max-height:140px;overflow:auto}.mover{display:grid;grid-template-columns:48px 1fr 68px;align-items:center;gap:9px;border:none;background:transparent;width:100%;padding:4px 0;min-height:30px;text-align:left}.mover:hover,.stock:hover{background:#ffffff09}.mover strong{text-align:right;font-variant-numeric:tabular-nums}.axis{height:20px;position:relative;background:linear-gradient(to right,transparent 49.6%,#8a9cb8 49.6%,#8a9cb8 50.4%,transparent 50.4%)}.bar{position:absolute;top:6px;height:8px;border-radius:3px}.watch{margin:16px 0 30px;overflow:hidden}.watch>.row{padding:17px 24px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{text-align:right;padding:10px 19px;border-top:1px solid #a1b3ce24;font-variant-numeric:tabular-nums;white-space:nowrap}th{background:#0c1b2d63;font-weight:500}td:first-child,th:first-child{text-align:left}td:first-child button{border:0;background:none;padding:0;color:inherit;font-weight:640;text-align:left;min-height:30px}.selected{background:#4d8cd91a;box-shadow:inset 3px 0 #77afff}.symbol{color:#adc7e9;margin-left:8px;font-size:12px}.ticker{color:#9fc8ff}.foot{margin:8px 0 0}.foot a{color:#bbd0ed}.status{font-size:12px;color:#ffd39a}#search{width:165px}select{max-width:180px}@media(min-width:1600px){.plot{height:230px}}@media(max-width:850px){.grid{grid-template-columns:1fr}.mover{min-height:36px}.panel{padding:18px}.titleline{flex-wrap:wrap}.metrics .metric{padding:0 15px}}@media(max-width:570px){header>div{height:52px}.titleline{align-items:flex-start;margin-top:21px}.ctrl{width:100%;justify-content:space-between}.metrics{grid-template-columns:1fr 1fr;gap:12px}.metric:first-child{grid-column:1/-1}.metric:nth-child(2){border-left:0}.big{font-size:24px}.row{flex-wrap:wrap}.ranges button{min-height:44px}.plot{height:174px}.watch>.row{padding:14px}.groupcol,.datecol{display:none}td,th{padding:9px 8px}.symbol{display:block;margin:0}.mover{min-height:44px}.watch .row input{width:126px}.price{font-size:32px}.stamp{font-size:10px}button,select,input{min-height:44px}}@media(prefers-reduced-transparency:reduce){.glass{background:#172940}}
</style><header><div><div class="identity"><span class="mark"></span>AI Market Watch</div><span class="stamp"><b>●</b> &nbsp;US EQUITIES &nbsp; / &nbsp; USD</span></div></header><main>
<div class="titleline"><div><h1>Market overview</h1><p class="meta" id="date">Loading closing prices…</p></div><div class="ctrl"><select id="group" aria-label="Company group"><option>All companies</option><option>Chips</option><option>Cloud platforms</option><option>Enterprise software</option></select><button id="refresh" class="refresh">↻ &nbsp;Refresh</button></div></div>
<div id="status" class="status" role="status"></div><section class="metrics glass" id="metrics"></section>
<div class="grid"><section class="glass panel"><div class="row"><div><span class="tag" id="stocktag">Price history</span><h2 id="name">Selected company</h2></div><div class="ranges" id="ranges"></div></div><div><span class="price" id="price">—</span><span id="delta" class="change"></span></div><svg class="plot" id="plot" role="img" aria-label="Historical daily closing prices"></svg><details><summary>View daily prices</summary><div class="history" id="history"></div></details></section>
<section class="glass panel"><span class="tag">Session performance</span><h2>Daily movers</h2><div id="movers"></div></section></div>
<section class="watch glass"><div class="row"><h2 style="margin:0;font-size:20px">Watchlist</h2><input id="search" type="search" placeholder="Find company…" aria-label="Find company"></div><div class="scroll"><table><thead><tr><th>Company</th><th class="groupcol">Group</th><th>Close</th><th>Daily move</th><th class="datecol">As of</th></tr></thead><tbody id="stocks"></tbody></table></div></section><p class="foot small"><a id="source" href="https://finance.yahoo.com/" target="_blank" rel="noreferrer">Yahoo Finance</a> · Daily closing prices in USD <span id="checked"></span></p></main>
<script>
const companies={NVDA:['NVIDIA','Chips'],AMD:['AMD','Chips'],AVGO:['Broadcom','Chips'],MSFT:['Microsoft','Cloud platforms'],GOOGL:['Alphabet','Cloud platforms'],AMZN:['Amazon','Cloud platforms'],IBM:['IBM','Enterprise software'],PLTR:['Palantir','Enterprise software']};
const el=id=>document.getElementById(id), money=n=>'$'+n.toFixed(2), pct=n=>(n>0?'+':'')+n.toFixed(2)+'%',tone=n=>n>0?'up':n<0?'down':'', day=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
let series={},selected='NVDA',range=1,errors=[],session='';
function change(s){const a=series[s];return 100*(a.at(-1)[1]/a.at(-2)[1]-1)}
function choose(s){selected=s;render();if(innerWidth<850)el('stocktag').scrollIntoView({block:'start'})}
const metric=(label,val,sub)=>'<div class="metric"><span class="tag">'+label+'</span><div class="big">'+val+'</div><span class="small">'+sub+'</span></div>';
function render(){const group=el('group').value,all=Object.keys(companies).filter(s=>group==='All companies'||companies[s][1]===group),valid=all.filter(s=>series[s]?.length>1),rank=valid.filter(s=>series[s].at(-1)[0]===session&&!errors.includes(s)).sort((a,b)=>change(b)-change(a));
if(!valid.includes(selected))selected=valid[0];const n=rank.length,median=n?(change(rank[Math.floor(n/2)])+change(rank[Math.floor((n-1)/2)]))/2:0,top=rank.reduce((t,s)=>!t||Math.abs(change(s))>Math.abs(change(t))?s:t,'');
el('date').textContent=session?'End of day  ·  '+day(session):'Closing prices unavailable';
el('metrics').innerHTML=metric('Median daily move',n?'<span class="'+tone(median)+'">'+pct(median)+'</span>':'—','vs. previous close')+metric('Advanced / covered',n?rank.filter(s=>change(s)>0).length+' <span class="small">/ '+n+'</span>':'—',n+' of '+all.length+' companies covered')+metric('Largest move',top?top+' <span class="'+tone(change(top))+'">'+pct(change(top))+'</span>':'—','by absolute daily change');
const max=Math.max(...rank.map(s=>Math.abs(change(s))),.01);el('movers').innerHTML=rank.map(s=>{const v=change(s);return '<button class="mover" data-s="'+s+'"><span class="mono">'+s+'</span><span class="axis"><i class="bar" style="'+(v<0?'right':'left')+':50%;width:'+Math.abs(v)/max*49+'%;background:'+(v<0?'#ff9ba6':'#83ebbb')+'"></i></span><strong class="'+tone(v)+'">'+pct(v)+'</strong></button>'}).join('')||'No current comparisons';
const matches=all.filter(s=>(s+' '+companies[s][0]).toLowerCase().includes(el('search').value.trim().toLowerCase()));
el('stocks').innerHTML=matches.map(s=>{const q=series[s]?.at(-1);return '<tr class="stock '+(selected===s?'selected':'')+'"><td><button data-s="'+s+'" '+(!q?'disabled':'')+'>'+companies[s][0]+' <span class="symbol">'+s+'</span></button></td><td class="groupcol small">'+companies[s][1]+'</td><td>'+(q?money(q[1]):'—')+'</td><td class="'+(q?tone(change(s)):'')+'">'+(q?pct(change(s)):'—')+'</td><td class="datecol small">'+(q?day(q[0]):'Unavailable')+'</td></tr>'}).join('')||'<tr><td colspan="5">No companies match. <button id="clear">Clear search</button></td></tr>';
if(!selected){el('name').textContent='Prices unavailable';el('price').textContent='—';el('delta').textContent='';el('stocktag').textContent='Price history';el('plot').innerHTML='';el('history').innerHTML='';return}
const a=series[selected],q=a.at(-1),v=change(selected),d=q[1]-a.at(-2)[1];el('stocktag').textContent=selected+'  /  '+companies[selected][1];el('name').textContent=companies[selected][0];el('price').textContent=money(q[1]);el('delta').className='change '+tone(v);el('delta').textContent=(d<0?'−':'+')+money(Math.abs(d))+' ('+pct(v)+')';el('source').href='https://finance.yahoo.com/quote/'+selected+'/history/';
const cutoff=new Date(q[0]+'T12:00:00Z');cutoff.setUTCMonth(cutoff.getUTCMonth()-range);const rows=a.filter(r=>r[0]>=cutoff.toISOString().slice(0,10));chart(rows);el('history').innerHTML='<table><thead><tr><th>Session</th><th>Close (USD)</th></tr></thead><tbody>'+rows.slice().reverse().map(r=>'<tr><td>'+day(r[0])+'</td><td>'+money(r[1])+'</td></tr>').join('')+'</tbody></table>';
el('ranges').innerHTML=[1,3,6,12].map(m=>'<button data-m="'+m+'" aria-pressed="'+(m===range)+'">'+(m===12?'1Y':m+'M')+'</button>').join('')}
function chart(rows){const svg=el('plot'),w=Math.max(240,svg.clientWidth),h=svg.clientHeight,r=w-50,values=rows.map(v=>v[1]),min=Math.min(...values),max=Math.max(...values),pad=(max-min)*.1||1,lo=min-pad,hi=max+pad,x=i=>3+i*(r-6)/Math.max(1,rows.length-1),y=v=>9+(hi-v)/(hi-lo)*(h-39),points=rows.map((v,i)=>x(i)+','+y(v[1])).join(' ');svg.setAttribute('viewBox','0 0 '+w+' '+h);let out='<defs><linearGradient id="fade" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#57a2ff" stop-opacity=".35"/><stop offset="1" stop-color="#57a2ff" stop-opacity="0"/></linearGradient></defs>';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;out+='<path d="M3 '+y(v)+' H'+r+'" stroke="#8daac1" stroke-opacity=".2" stroke-dasharray="3 5"/><text x="'+(r+5)+'" y="'+(y(v)+4)+'">'+v.toFixed(1)+'</text>'}out+='<polygon points="3,'+(h-23)+' '+points+' '+x(rows.length-1)+','+(h-23)+'" fill="url(#fade)"/><polyline points="'+points+'" fill="none" stroke="#83baff" stroke-width="2.6" stroke-linejoin="round"/><circle cx="'+x(rows.length-1)+'" cy="'+y(values.at(-1))+'" r="4" fill="#bbd9ff"/>';for(let i=0;i<3;i++){const idx=Math.round(i*(rows.length-1)/2);out+='<text x="'+x(idx)+'" y="'+(h-6)+'" text-anchor="'+['start','middle','end'][i]+'">'+day(rows[idx][0]).slice(0,-5)+'</text>'}svg.innerHTML=out}
async function load(force){const b=el('refresh');b.disabled=true;b.textContent='Checking…';try{const r=await fetch(force?'/api/refresh':'/api/prices');if(!r.ok)throw Error();const data=await r.json();series=data.series;errors=data.errors||[];const prior=session;session=Object.values(series).map(a=>a.at(-1)[0]).sort().at(-1)||'';render();el('status').textContent=errors.length?'Update unavailable for '+errors.join(', ')+'. Cached prices retain their session date.':force?(prior===session?'No newer close available.':'Prices updated.') :'';el('checked').textContent=' · Last checked '+new Date(data.checked).toLocaleString()}catch{el('status').textContent='Refresh unavailable. Try again.'}finally{b.disabled=false;b.textContent='↻  Refresh'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.s)choose(b.dataset.s);if(b.dataset.m){range=+b.dataset.m;render()}if(b.id==='clear'){el('search').value='';render()}});el('refresh').onclick=()=>load(true);el('group').onchange=render;el('search').oninput=render;window.addEventListener('resize',()=>{if(selected&&series[selected])render()});load(false);
</script></html>
